name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm install -g npm@11  # lockfile is written by npm 11; npm 10 cannot `npm ci` it
      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: E2E smoke (functional, no screenshots)
        run: npm run test:e2e

      - name: React Doctor (advisory)
        run: npx --no-install react-doctor --blocking none --no-telemetry
        continue-on-error: true
