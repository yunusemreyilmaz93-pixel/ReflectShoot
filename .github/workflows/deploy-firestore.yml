name: Deploy Firestore rules and indexes

# Runs when the rules/indexes change on main, or manually. Needs the repository secret
# FIREBASE_SERVICE_ACCOUNT_JSON (a service-account key with the "Firebase Rules Admin" and
# "Cloud Datastore Index Admin" roles). Without the secret the job only runs the rules tests.
on:
  push:
    branches: [main]
    paths:
      - firestore.rules
      - firestore.indexes.json
      - firebase.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-firestore
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install -g npm@11  # lockfile is written by npm 11; npm 10 cannot `npm ci` it
      - run: npm ci
      - name: Rules regression tests
        run: npm run test:rules
      - name: Deploy rules and indexes
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "::warning::FIREBASE_SERVICE_ACCOUNT_JSON secret is not set; skipping deploy."
            exit 0
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-sa.json"
          # No --force: indexes that exist only in the console are never deleted.
          npx firebase deploy --only firestore:rules,firestore:indexes --project reflectandshoot --non-interactive
          rm -f "$RUNNER_TEMP/firebase-sa.json"
